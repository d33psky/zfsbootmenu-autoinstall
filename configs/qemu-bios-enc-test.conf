## QEMU BIOS test config - ENCRYPTED, PASSPHRASE variant (test-bios-headless.sh):
## legacy boot (SeaBIOS -> GPT gptmbr -> syslinux -> ZBM), native ZFS encryption
## with KEYFORMAT=passphrase typed at the ZBM console prompt (over the harness's
## serial socket), plus a swap partition and a capped ARC. Shaped like a small
## legacy-BIOS laptop (4G RAM, 64G disk).
## The passphrase file lives in test/ (gitignored):
##   (umask 077; printf '%s\n' 'qemu test passphrase' > test/qemu-pass.key)

DISKID="virtio-bios0"
HOSTNAME="zbm-bios-enc-test"
USERNAME="test"
USERPASS="test"
TIMEZONE="UTC"
POOL_NAME="zroot"
COMPRESSION="lz4"
UBUNTU_VER="resolute"
GNU_USERLAND="on"
DISTRO="server"
BOOT_MODE="bios"
BOOT_SIZE="1G"
SWAP_SIZE="4096"
ASHIFT="12"

ENCRYPTION="on"
KEYFORMAT="passphrase"
KEYFILE="test/qemu-pass.key"
## console=ttyS0 LAST: ZBM's prompt goes to the last console = the harness serial socket
CMDLINE_EXTRA="console=tty0 console=ttyS0 zfs.zfs_arc_max=262144000"
