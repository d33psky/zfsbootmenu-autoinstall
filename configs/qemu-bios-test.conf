##Configuration for QEMU BIOS boot testing
##Used by zfs-install.sh
##
##This config is for testing BIOS boot mode in QEMU

##Required settings
##Note: QEMU virtio disk ID format
DISKID="virtio-test-disk"
HOSTNAME="qemu-test"
USERNAME="test"
USERPASS="test"
DISTRO="server"
TIMEZONE="Europe/Amsterdam"

##Optional settings
POOL_NAME="zroot"
COMPRESSION="lz4"
UBUNTU_VER="noble"
SWAP_SIZE="0"  ##0 = no swap partition

##BIOS boot mode
BOOT_MODE="bios"
