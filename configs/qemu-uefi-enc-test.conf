## QEMU UEFI test config - ENCRYPTED variant: native ZFS encryption with
## unattended remote unlock (the harness host serves the key at 10.0.2.2 over
## QEMU user-net - same unicast-HTTP flow as a real key server) + dropbear.
## Key + authorized_keys live in test/ (gitignored):
##   head -c 32 /dev/urandom > test/qemu-test.key
##   python3 -m http.server 8437 --directory test    # on the harness host

DISKID="virtio-nvme0"
MIRRORDISKID="virtio-nvme1"
HOSTNAME="zbm-uefi-enc-test"
USERNAME="test"
USERPASS="test"
TIMEZONE="UTC"
POOL_NAME="zroot"
COMPRESSION="lz4"
UBUNTU_VER="noble"
DISTRO="server"
BOOT_MODE="uefi"
SWAP_SIZE="0"
BOOT_SIZE="1G"      ## ZBM image headroom (dracut network + dropbear grow it)
ROOT_SIZE="8G"
ASHIFT="12"

ENCRYPTION="on"
KEYFILE="test/qemu-test.key"
ZBM_KEYFETCH_URL="http://10.0.2.2:8437/qemu-test.key"
ZBM_NET_ARGS="rd.neednet=1 ip=dhcp"   ## QEMU user-net; real hosts use static ip= (+ vlan=)
ZBM_DROPBEAR="on"
ZBM_DROPBEAR_KEYS="test/authorized_keys"
ZBM_DROPBEAR_PORT="222"
CMDLINE_EXTRA="console=tty0 console=ttyS0"   ## full boot visible in the harness serial log
