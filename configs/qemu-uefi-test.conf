## QEMU UEFI test config - exercises the bounded-root layout in a VM:
##   bounded root + reserved "special" partition, then a UEFI root mirror.
## Two virtio disks are presented as /dev/disk/by-id/virtio-nvme0 and -nvme1
## (see test-uefi-qemu.sh). Sizes are small on purpose - the partition/mirror
## logic is size-agnostic, so 8G root validates the same code path as 600G.

DISKID="virtio-nvme0"
MIRRORDISKID="virtio-nvme1"
HOSTNAME="zbm-uefi-test"
USERNAME="test"
USERPASS="test"
TIMEZONE="UTC"
POOL_NAME="zroot"
COMPRESSION="lz4"
UBUNTU_VER="noble"
DISTRO="server"
BOOT_MODE="uefi"
SWAP_SIZE="0"
BOOT_SIZE="512M"
ROOT_SIZE="8G"      ## bounded root; remainder -> reserved part3 (mimics a special-vdev slice)
ASHIFT="12"
